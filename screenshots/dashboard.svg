<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0c8de9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c8de9" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e1526" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c8de9"/>
      <stop offset="100%" stop-color="#0270c7"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#070a13"/>
  <circle cx="250" cy="150" r="350" fill="url(#bgGlow1)" filter="url(#blurFilter)"/>
  <circle cx="1050" cy="400" r="400" fill="url(#bgGlow2)" filter="url(#blurFilter)"/>

  <!-- Window Frame -->
  <rect x="0" y="0" width="1280" height="56" fill="#0d121e" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="0" x2="1280" y2="0" stroke="url(#headerGrad)" stroke-width="2"/>

  <!-- Logo -->
  <rect x="24" y="14" width="30" height="30" rx="8" fill="#0c8de9"/>
  <path d="M39 23 A 6 6 0 0 1 39 35 M39 26 A 3 3 0 0 1 39 32" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="39" cy="29" r="1.5" fill="#ffffff"/>
  <text x="64" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15" font-weight="bold">AirLink <tspan fill="#38a8f8" font-size="11" font-weight="600" letter-spacing="1">STUDIO</tspan></text>

  <!-- Navigation Pills -->
  <g transform="translate(500, 12)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="4" y="4" width="85" height="24" rx="12" fill="#0c8de9" fill-opacity="0.25" stroke="#38a8f8" stroke-opacity="0.4"/>
    <text x="46" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Dashboard</text>
    <text x="135" y="20" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Workspace</text>
    <text x="200" y="20" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Files</text>
    <text x="250" y="20" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Settings</text>
  </g>

  <!-- Window controls -->
  <g transform="translate(1200, 22)">
    <circle cx="0" cy="6" r="6" fill="#475569"/>
    <circle cx="20" cy="6" r="6" fill="#475569"/>
    <circle cx="40" cy="6" r="6" fill="#f43f5e"/>
  </g>

  <!-- Hero Banner -->
  <g transform="translate(48, 86)">
    <rect x="0" y="0" width="1184" height="120" rx="24" fill="#131c30" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="24" y="22" width="220" height="24" rx="12" fill="#0c8de9" fill-opacity="0.2" stroke="#38a8f8" stroke-opacity="0.3"/>
    <text x="134" y="38" fill="#7cc7fb" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✦ NEXT-GEN ANDROID ENGINE</text>
    <text x="24" y="74" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Connect Everything. Control Everything.</text>
    <text x="24" y="96" fill="#94a3b8" font-family="sans-serif" font-size="12">Ultra-low latency screen mirroring, full mouse/keyboard control, Display Off mode &amp; 2-way file management.</text>
  </g>

  <!-- Dual Connection Cards -->
  <!-- USB Card -->
  <g transform="translate(48, 230)">
    <rect x="0" y="0" width="576" height="210" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="68" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">USB Cable Connection</text>
    <text x="68" y="50" fill="#94a3b8" font-family="sans-serif" font-size="11">Zero-latency direct hardware link</text>
    
    <rect x="470" y="20" width="86" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.3"/>
    <circle cx="482" cy="31" r="3" fill="#34d399"/>
    <text x="520" y="35" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Authorized</text>

    <!-- Detected Device inside USB -->
    <rect x="20" y="70" width="536" height="74" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="36" y="100" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Realme RMX5030</text>
    <text x="36" y="120" fill="#64748b" font-family="monospace" font-size="11">10.158.199.85:5555 • Android 16 • 1080x2374 • 88% Battery</text>

    <!-- Card Action Buttons -->
    <rect x="20" y="160" width="160" height="34" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="100" y="181" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Convert to Wireless</text>

    <rect x="436" y="160" width="120" height="34" rx="10" fill="url(#primaryBtn)"/>
    <text x="496" y="181" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">▶ Mirror Now</text>
  </g>

  <!-- Wi-Fi Card -->
  <g transform="translate(656, 230)">
    <rect x="0" y="0" width="576" height="210" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#00d2ff" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.3"/>
    <text x="68" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Wireless Wi-Fi Link</text>
    <text x="68" y="50" fill="#94a3b8" font-family="sans-serif" font-size="11">Wire-free high-speed local streaming</text>

    <!-- Connect Inputs -->
    <rect x="20" y="78" width="360" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="36" y="101" fill="#94a3b8" font-family="monospace" font-size="12">192.168.1.100</text>
    <rect x="390" y="78" width="80" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="415" y="101" fill="#94a3b8" font-family="monospace" font-size="12">5555</text>
    <rect x="480" y="78" width="76" height="36" rx="10" fill="url(#primaryBtn)"/>
    <text x="518" y="101" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Connect</text>

    <line x1="20" y1="140" x2="556" y2="140" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="20" y="178" fill="#64748b" font-family="sans-serif" font-size="11">Android 11+ Pairing with 6-digit code supported</text>
    <rect x="376" y="160" width="180" height="34" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="466" y="181" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pair with 6-Digit Code</text>
  </g>

  <!-- Detected Devices Table -->
  <g transform="translate(48, 470)">
    <text x="0" y="20" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Connected Devices (1)</text>

    <rect x="0" y="34" width="1184" height="88" rx="18" fill="#111726" fill-opacity="0.8" stroke="#38a8f8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="20" y="52" width="50" height="50" rx="12" fill="#0c8de9" fill-opacity="0.15" stroke="#38a8f8" stroke-opacity="0.3"/>
    <text x="45" y="82" fill="#38a8f8" font-family="sans-serif" font-size="18" text-anchor="middle">📱</text>

    <text x="86" y="68" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Realme RMX5030</text>
    <text x="86" y="88" fill="#64748b" font-family="monospace" font-size="11">Serial: 10.158.199.85:5555 • Wi-Fi • Android 16 • 1080x2374 (120 FPS capable)</text>

    <rect x="910" y="58" width="90" height="38" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="955" y="82" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Browse Files</text>

    <rect x="1010" y="58" width="150" height="38" rx="12" fill="url(#primaryBtn)"/>
    <text x="1085" y="82" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">▶ Launch Mirroring</text>
  </g>
</svg>
