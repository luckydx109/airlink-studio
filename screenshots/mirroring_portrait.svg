<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c8de9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1523" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141c2e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#070a13"/>
  <circle cx="640" cy="400" r="450" fill="url(#phoneGlow)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" fill="#0d121e" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="24" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">AirLink Studio <tspan fill="#38a8f8" font-size="12">/ Workspace</tspan></text>
  <rect x="560" y="14" width="160" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.3"/>
  <circle cx="575" cy="28" r="4" fill="#34d399"/>
  <text x="645" y="32" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live Stream • 60 FPS</text>

  <!-- Centered Smartphone Chassis -->
  <g transform="translate(490, 80)">
    <!-- Chassis Body -->
    <rect x="0" y="0" width="300" height="640" rx="42" fill="#000000" stroke="#22283a" stroke-width="5" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.9))"/>
    <!-- Speaker slit -->
    <rect x="110" y="8" width="80" height="3" rx="1.5" fill="#353d52"/>

    <!-- Screen Surface -->
    <rect x="12" y="18" width="276" height="604" rx="30" fill="#0b0f1a"/>

    <!-- Android Status Bar -->
    <text x="32" y="40" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">17:48</text>
    <circle cx="138" cy="36" r="6" fill="#000000" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="246" y="40" fill="#34d399" font-family="sans-serif" font-size="11">88% ⚡</text>

    <!-- Simulated Phone UI Content -->
    <g transform="translate(24, 70)">
      <!-- App Header / Wallpaper UI -->
      <rect x="0" y="0" width="252" height="110" rx="18" fill="#1e293b" fill-opacity="0.6"/>
      <circle cx="36" cy="36" r="18" fill="#0c8de9"/>
      <text x="36" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">A</text>
      <text x="66" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">AirLink Connected</text>
      <text x="66" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">scrcpy hardware stream active</text>
      <rect x="16" y="70" width="220" height="26" rx="8" fill="#0c8de9" fill-opacity="0.25"/>
      <text x="126" y="87" fill="#38a8f8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Touch &amp; Keyboard Synced</text>

      <!-- Apps Grid -->
      <g transform="translate(10, 140)">
        <rect x="0" y="0" width="45" height="45" rx="12" fill="#3b82f6"/>
        <rect x="62" y="0" width="45" height="45" rx="12" fill="#10b981"/>
        <rect x="124" y="0" width="45" height="45" rx="12" fill="#f59e0b"/>
        <rect x="186" y="0" width="45" height="45" rx="12" fill="#ec4899"/>

        <rect x="0" y="70" width="45" height="45" rx="12" fill="#8b5cf6"/>
        <rect x="62" y="70" width="45" height="45" rx="12" fill="#06b6d4"/>
        <rect x="124" y="70" width="45" height="45" rx="12" fill="#64748b"/>
        <rect x="186" y="70" width="45" height="45" rx="12" fill="#14b8a6"/>
      </g>
    </g>

    <!-- Bottom Gesture Pill -->
    <rect x="100" y="605" width="100" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- Floating Liquid Glass Toolbar -->
  <g transform="translate(390, 720)">
    <rect x="0" y="0" width="500" height="52" rx="20" fill="url(#hudGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.7))"/>
    
    <!-- Android Navigation Cluster -->
    <text x="35" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">◀</text>
    <circle cx="85" cy="26" r="6" stroke="#ffffff" stroke-width="2" fill="none"/>
    <rect x="130" y="20" width="12" height="12" rx="2" stroke="#ffffff" stroke-width="2" fill="none"/>
    <line x1="165" y1="12" x2="165" y2="40" stroke="#ffffff" stroke-opacity="0.15"/>

    <!-- Orientation Badge -->
    <rect x="180" y="12" width="85" height="28" rx="8" fill="#ffffff" fill-opacity="0.08"/>
    <text x="222" y="30" fill="#38a8f8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⟳ PORTRAIT</text>
    <line x1="280" y1="12" x2="280" y2="40" stroke="#ffffff" stroke-opacity="0.15"/>

    <!-- Input & Controls -->
    <text x="305" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" title="Keyboard">⌨</text>
    <text x="345" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" title="Screenshot">📷</text>
    <text x="385" y="32" fill="#fbbf24" font-family="sans-serif" font-size="14" title="Display Off">👁‍🗨</text>
    <line x1="415" y1="12" x2="415" y2="40" stroke="#ffffff" stroke-opacity="0.15"/>

    <!-- Window controls -->
    <text x="440" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" title="Fullscreen">⛶</text>
    <text x="470" y="32" fill="#f43f5e" font-family="sans-serif" font-size="14" title="Disconnect">⏻</text>
  </g>
</svg>
