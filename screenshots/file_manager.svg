<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <radialGradient id="fileGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="storageBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c8de9"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#070a13"/>
  <circle cx="300" cy="300" r="450" fill="url(#fileGlow)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" fill="#0d121e" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="24" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">AirLink Studio <tspan fill="#6366f1" font-size="12">/ 2-Way File Manager</tspan></text>

  <!-- Storage Meter Card -->
  <g transform="translate(48, 80)">
    <rect x="0" y="0" width="1184" height="80" rx="18" fill="#111726" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="24" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Realme RMX5030 Internal Storage</text>
    <text x="1160" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="end"><tspan fill="#ffffff" font-weight="bold">64.2 GB</tspan> used of 256.0 GB</text>
    
    <!-- Progress Bar -->
    <rect x="24" y="46" width="1136" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="24" y="46" width="285" height="8" rx="4" fill="url(#storageBar)"/>
    <text x="24" y="70" fill="#64748b" font-family="sans-serif" font-size="10">25.1% Full</text>
    <text x="1160" y="70" fill="#10b981" font-family="sans-serif" font-size="10" text-anchor="end">191.8 GB Free</text>
  </g>

  <!-- Category Shortcut Pills -->
  <g transform="translate(48, 175)">
    <rect x="0" y="0" width="105" height="32" rx="12" fill="#0c8de9" fill-opacity="0.2" stroke="#38a8f8" stroke-opacity="0.4"/>
    <text x="52" y="20" fill="#38a8f8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🗄 Storage Root</text>

    <rect x="115" y="0" width="115" height="32" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="172" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">📷 Camera / DCIM</text>

    <rect x="240" y="0" width="90" height="32" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="285" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">🖼 Pictures</text>

    <rect x="340" y="0" width="95" height="32" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="387" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">📥 Downloads</text>

    <rect x="445" y="0" width="100" height="32" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="495" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">📄 Documents</text>

    <rect x="555" y="0" width="85" height="32" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="597" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">🎬 Movies</text>

    <rect x="650" y="0" width="80" height="32" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="690" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">🎵 Music</text>
  </g>

  <!-- Toolbar / Breadcrumb Bar -->
  <g transform="translate(48, 220)">
    <rect x="0" y="0" width="1184" height="46" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="28" fill="#38a8f8" font-family="monospace" font-size="12">/sdcard/DCIM/Camera</text>

    <!-- Action buttons -->
    <rect x="880" y="8" width="130" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="945" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ New Folder</text>

    <rect x="1020" y="8" width="150" height="30" rx="8" fill="#0c8de9"/>
    <text x="1095" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⬆ Upload to Phone</text>
  </g>

  <!-- File Grid View -->
  <g transform="translate(48, 285)">
    <!-- File Card 1 -->
    <rect x="0" y="0" width="180" height="150" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="90" y="65" font-size="34" text-anchor="middle">📁</text>
    <text x="90" y="105" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Screenshots</text>
    <text x="90" y="125" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Folder • 42 items</text>

    <!-- File Card 2 -->
    <rect x="200" y="0" width="180" height="150" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="290" y="65" font-size="34" text-anchor="middle">🖼</text>
    <text x="290" y="105" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">IMG_20261112.jpg</text>
    <text x="290" y="125" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">4.2 MB • Today</text>

    <!-- File Card 3 -->
    <rect x="400" y="0" width="180" height="150" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="490" y="65" font-size="34" text-anchor="middle">🎬</text>
    <text x="490" y="105" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VID_4K_60FPS.mp4</text>
    <text x="490" y="125" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">128.4 MB • Yesterday</text>

    <!-- File Card 4 -->
    <rect x="600" y="0" width="180" height="150" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="690" y="65" font-size="34" text-anchor="middle">📄</text>
    <text x="690" y="105" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Document_2026.pdf</text>
    <text x="690" y="125" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">1.8 MB • Nov 10</text>
  </g>

  <!-- Live Transfer Drawer Preview -->
  <g transform="translate(850, 520)">
    <rect x="0" y="0" width="380" height="240" rx="20" fill="#111728" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))"/>
    <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Active File Transfers</text>
    <rect x="290" y="18" width="65" height="20" rx="10" fill="#0c8de9" fill-opacity="0.2"/>
    <text x="322" y="32" fill="#38a8f8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">1 Active</text>

    <!-- Transfer Item 1 -->
    <rect x="16" y="55" width="348" height="85" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="80" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">VID_4K_60FPS.mp4</text>
    <text x="348" y="80" fill="#00d2ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">72%</text>
    
    <rect x="32" y="94" width="316" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="32" y="94" width="227" height="6" rx="3" fill="#00d2ff"/>

    <text x="32" y="122" fill="#94a3b8" font-family="monospace" font-size="10">92.4 MB / 128.4 MB</text>
    <text x="348" y="122" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">28.4 MB/s • ETA 2s</text>
  </g>
</svg>
