<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <radialGradient id="landGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="hudGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1523" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141c2e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#070a13"/>
  <circle cx="640" cy="400" r="500" fill="url(#landGlow)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="56" fill="#0d121e" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="24" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">AirLink Studio <tspan fill="#00d2ff" font-size="12">/ Adaptive Landscape Fullscreen</tspan></text>
  <rect x="520" y="14" width="240" height="28" rx="14" fill="#00d2ff" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.3"/>
  <circle cx="535" cy="28" r="4" fill="#22d3ee"/>
  <text x="645" y="32" fill="#22d3ee" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Adaptive Landscape (2374×1080)</text>

  <!-- Expanded Landscape Chassis -->
  <g transform="translate(40, 75)">
    <!-- Chassis Body (Horizontal Widescreen) -->
    <rect x="0" y="0" width="1200" height="630" rx="36" fill="#000000" stroke="#1f2638" stroke-width="5" filter="drop-shadow(0 25px 60px rgba(0,0,0,0.95))"/>
    
    <!-- Left speaker slit in landscape -->
    <rect x="8" y="275" width="3" height="80" rx="1.5" fill="#353d52"/>

    <!-- Screen Surface -->
    <rect x="18" y="12" width="1164" height="606" rx="26" fill="url(#gameGrad)"/>

    <!-- Android Landscape Status Bar -->
    <text x="40" y="36" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">17:49</text>
    <circle cx="60" cy="305" r="6" fill="#000000" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1110" y="36" fill="#34d399" font-family="sans-serif" font-size="12">88% ⚡</text>

    <!-- Simulated Landscape Video / Game Content -->
    <g transform="translate(100, 80)">
      <!-- Cinematic Game HUD simulation -->
      <circle cx="480" cy="200" r="120" fill="#6366f1" fill-opacity="0.15"/>
      <polygon points="450,150 550,200 450,250" fill="#00d2ff" fill-opacity="0.8"/>
      
      <rect x="250" y="380" width="460" height="40" rx="12" fill="#000000" fill-opacity="0.6"/>
      <text x="480" y="405" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Full Laptop Display Utilized • Zero Letterboxing</text>
      
      <!-- Mini health/game bar -->
      <rect x="20" y="20" width="220" height="12" rx="6" fill="#1e293b"/>
      <rect x="20" y="20" width="180" height="12" rx="6" fill="#10b981"/>
      <text x="20" y="50" fill="#94a3b8" font-family="monospace" font-size="11">FPS: 120.0 • Latency: 8ms</text>
    </g>

    <!-- Bottom Gesture Pill in landscape -->
    <rect x="520" y="605" width="160" height="4" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  </g>

  <!-- Floating HUD docked cleanly at bottom -->
  <g transform="translate(415, 730)">
    <rect x="0" y="0" width="450" height="48" rx="18" fill="url(#hudGrad2)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="30" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">◀</text>
    <circle cx="75" cy="24" r="6" stroke="#ffffff" stroke-width="2" fill="none"/>
    <rect x="115" y="18" width="12" height="12" rx="2" stroke="#ffffff" stroke-width="2" fill="none"/>
    <line x1="145" y1="10" x2="145" y2="38" stroke="#ffffff" stroke-opacity="0.15"/>

    <rect x="155" y="10" width="100" height="28" rx="8" fill="#00d2ff" fill-opacity="0.2"/>
    <text x="205" y="28" fill="#00d2ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⟳ LANDSCAPE</text>
    <line x1="265" y1="10" x2="265" y2="38" stroke="#ffffff" stroke-opacity="0.15"/>

    <text x="285" y="30" fill="#ffffff" font-family="sans-serif" font-size="14">⌨</text>
    <text x="320" y="30" fill="#ffffff" font-family="sans-serif" font-size="14">📷</text>
    <text x="355" y="30" fill="#fbbf24" font-family="sans-serif" font-size="14">👁‍🗨</text>
    <line x1="380" y1="10" x2="380" y2="38" stroke="#ffffff" stroke-opacity="0.15"/>

    <text x="400" y="30" fill="#38a8f8" font-family="sans-serif" font-size="14" font-weight="bold">⛶</text>
    <text x="425" y="30" fill="#f43f5e" font-family="sans-serif" font-size="14">⏻</text>
  </g>
</svg>
